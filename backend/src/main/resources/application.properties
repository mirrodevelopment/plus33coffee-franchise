# ==============================================================================
# PLUS33 CAFÉ FRANÇAIS — FRANCHISE BACKEND CONFIGURATION
# Spring Boot 3.4 · Java 21
#
# ⚠️  This is the DEVELOPMENT profile (H2 in-memory database)
#     For production MySQL, see application-prod.properties
# ==============================================================================

spring.application.name=plus33-franchise-backend

# ==============================================================================
# SERVER
# ==============================================================================
server.port=8080
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# ==============================================================================
# DATABASE — H2 In-Memory (Development)
# Starts fresh on every restart. Great for testing.
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:plus33db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ==============================================================================
# JPA / HIBERNATE
# ==============================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ==============================================================================
# JACKSON — JSON Date/Time Formatting
# ==============================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# ==============================================================================
# MAIL — Gmail SMTP Configuration
# Used for: applicant confirmations + admin notifications
#
# ⚠️  Replace XXXXX with your Gmail App Password
#    (Gmail → Settings → Security → App Passwords)
# ==============================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=plus33coffee.franchises@gmail.com
spring.mail.password=REPLACE_WITH_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# Custom mail properties
plus33.mail.from=noreply@plus33cafe.com

# ==============================================================================
# ACTUATOR — Health Monitoring
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

info.app.name=PLUS33 Franchise Backend
info.app.version=1.0.0
info.app.description=Backend API for PLUS33 Cafe Francais Franchise Management

# ==============================================================================
# LOGGING
# ==============================================================================
logging.level.com.plus33=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
