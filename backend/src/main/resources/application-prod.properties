# ==============================================================================
# PLUS33 FRANCHISE BACKEND — PRODUCTION PROFILE
# Active profile: spring.profiles.active=prod
#
# Usage: java -jar franchise-backend.jar --spring.profiles.active=prod
# ==============================================================================

# ==============================================================================
# DATABASE — MySQL Production
# ==============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/plus33_franchise?useSSL=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=REPLACE_WITH_DB_USER
spring.datasource.password=REPLACE_WITH_DB_PASSWORD

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA — MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console — DISABLED in production
spring.h2.console.enabled=false

# ==============================================================================
# MAIL
# ==============================================================================
spring.mail.username=plus33coffee.franchises@gmail.com
spring.mail.password=REPLACE_WITH_APP_PASSWORD

# ==============================================================================
# SECURITY — Change default admin password in production!
# ==============================================================================
# plus33.admin.password=REPLACE_WITH_STRONG_PASSWORD

# ==============================================================================
# LOGGING — Less verbose in production
# ==============================================================================
logging.level.com.plus33=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# ==============================================================================
# ACTUATOR — Restrict in production
# ==============================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
